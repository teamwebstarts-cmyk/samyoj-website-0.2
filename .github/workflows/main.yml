name: Deploy Samyoj Website to GitHub Pages

on:
  push:
    branches:
      - samyoj-new-features
      - samyoj-new-features-CRM

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: './samyoj-homepage'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
